<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{loggedIn}">
    <f:then>
        <div class="login-container">
            <div class="login-card">
                <h2>OV-SSP</h2>
                <div class="alert alert-success">
                    Logged in as <strong>{currentUser.username}</strong>
                </div>
                <div style="display:flex;gap:8px;flex-direction:column">
                    <a href="/portal" class="btn btn-primary btn-login">Go to Portal</a>
                    <form method="post" action="" style="margin:0">
                        <input type="hidden" name="logintype" value="logout" />
                        <button type="submit" class="btn btn-outline btn-login" style="width:100%">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </f:then>
    <f:else>
        <div class="login-container">
            <div class="login-card">
                <div style="text-align:center;margin-bottom:24px">
                    <div class="logo-icon" style="width:48px;height:48px;font-size:18px;margin:0 auto 12px;border-radius:10px;background:#1e3a5f;color:white;display:flex;align-items:center;justify-content:center">SSP</div>
                    <h2 style="margin-bottom:4px">Self-Service Portal</h2>
                    <p style="font-size:13px;color:#6b7280">Sign in to manage users and permissions</p>
                </div>

                <f:flashMessages />

                <form method="post" action="">
                    <input type="hidden" name="logintype" value="login" />
                    <div class="form-group">
                        <label for="user" class="form-label">Username</label>
                        <input type="text" name="user" id="user" class="form-input" required="required" autocomplete="username" />
                    </div>
                    <div class="form-group">
                        <label for="pass" class="form-label">Password</label>
                        <input type="password" name="pass" id="pass" class="form-input" required="required" autocomplete="current-password" />
                    </div>
                    <button type="submit" class="btn btn-primary btn-login" style="margin-top:8px">Sign in</button>
                </form>
            </div>
        </div>
    </f:else>
</f:if>

</html>

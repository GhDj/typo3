<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Portal" />
<f:section name="Content">

    <div class="page-header">
        <h1 class="page-title">Directories</h1>
    </div>

    <f:if condition="{directories}">
        <f:then>
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Directory</th>
                            <th>Description</th>
                            <th>Read</th>
                            <th>Write</th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{directories}" as="dir">
                            <tr>
                                <td><strong>{dir.name}</strong></td>
                                <td style="color:var(--color-text-secondary)">{dir.description}</td>
                                <td>
                                    <f:if condition="{dir.allows_read}">
                                        <f:then><span class="status-icon status-active">&#10004;</span></f:then>
                                        <f:else><span style="color:var(--color-text-muted)">&mdash;</span></f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:if condition="{dir.allows_write}">
                                        <f:then><span class="status-icon status-active">&#10004;</span></f:then>
                                        <f:else><span style="color:var(--color-text-muted)">&mdash;</span></f:else>
                                    </f:if>
                                </td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
                <div class="table-footer">
                    <span>Show 1 to {directories -> f:count()} of {directories -> f:count()} results</span>
                </div>
            </div>
        </f:then>
        <f:else>
            <div class="alert alert-info">No directories found.</div>
        </f:else>
    </f:if>

</f:section>

</html>

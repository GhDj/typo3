<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<!-- Header -->
<header class="app-header">
    <div class="app-header-left">
        <div class="app-header-logo">
            <div class="logo-icon">SSP</div>
            <div class="logo-text">
                <div class="logo-title">Self-Service</div>
                <div class="logo-subtitle">User management</div>
            </div>
        </div>
    </div>
    <div class="app-header-right">
        <f:if condition="{currentUserName}">
            <div class="header-avatar" title="{currentUserName}">{userInitials}</div>
        </f:if>
    </div>
</header>

<div class="app-layout">
    <!-- Sidebar -->
    <nav class="app-sidebar">
        <a href="/portal" class="nav-item{f:if(condition: '{activeNav} == \'dashboard\'', then: ' active')}">
            <span class="nav-icon">&#8962;</span> Dashboard
        </a>
        <a href="/portal?tx_thwovssp_portal[action]=index" class="nav-item{f:if(condition: '{activeNav} == \'users\'', then: ' active')}">
            <span class="nav-icon">&#9775;</span> Users
        </a>
        <a href="/portal?tx_thwovssp_portal[action]=directories" class="nav-item{f:if(condition: '{activeNav} == \'directories\'', then: ' active')}">
            <span class="nav-icon">&#128193;</span> Directories
        </a>

        <div class="nav-section">Central administration</div>
        <a href="/portal?tx_thwovssp_portal[action]=orgunits" class="nav-item{f:if(condition: '{activeNav} == \'orgunits\'', then: ' active')}">
            <span class="nav-icon">&#127970;</span> Organisational units
        </a>
    </nav>

    <!-- Content -->
    <main class="app-content">
        <f:if condition="{breadcrumbs}">
            <div class="breadcrumb">
                <f:for each="{breadcrumbs}" as="crumb" iteration="i">
                    <f:if condition="{i.isLast}">
                        <f:then><span>{crumb.label}</span></f:then>
                        <f:else>
                            <f:if condition="{crumb.link}">
                                <f:then><a href="{crumb.link}">{crumb.label}</a></f:then>
                                <f:else><span>{crumb.label}</span></f:else>
                            </f:if>
                            <span class="sep">&#8250;</span>
                        </f:else>
                    </f:if>
                </f:for>
            </div>
        </f:if>

        <f:render section="Content" arguments="{_all}" />
    </main>
</div>

</html>

<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:if condition="{pagination.totalPages} > 1">
    <nav class="mt-4">
        <ul class="pagination">
            <li class="page-item{f:if(condition: '!{pagination.hasPrev}', then: ' disabled')}">
                <f:if condition="{pagination.hasPrev}">
                    <f:then>
                        <a class="page-link" href="{be:moduleLink(route: pagination.route, arguments: '{page: pagination.prevPage}')}">&laquo;</a>
                    </f:then>
                    <f:else>
                        <span class="page-link">&laquo;</span>
                    </f:else>
                </f:if>
            </li>

            <f:for each="{pagination.pages}" as="p">
                <f:if condition="{p.number} == -1">
                    <f:then>
                        <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
                    </f:then>
                    <f:else>
                        <li class="page-item{f:if(condition: p.isCurrent, then: ' active')}">
                            <a class="page-link" href="{be:moduleLink(route: pagination.route, arguments: '{page: p.number}')}">{p.number}</a>
                        </li>
                    </f:else>
                </f:if>
            </f:for>

            <li class="page-item{f:if(condition: '!{pagination.hasNext}', then: ' disabled')}">
                <f:if condition="{pagination.hasNext}">
                    <f:then>
                        <a class="page-link" href="{be:moduleLink(route: pagination.route, arguments: '{page: pagination.nextPage}')}">&raquo;</a>
                    </f:then>
                    <f:else>
                        <span class="page-link">&raquo;</span>
                    </f:else>
                </f:if>
            </li>
        </ul>
    </nav>
</f:if>

</html>

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Init\Thw\Ovssp\:
    resource: '../Classes/*'

  Init\Thw\Ovssp\Controller\ImportController:
    public: true

  Init\Thw\Ovssp\Controller\PortalController:
    public: true

  Init\Thw\Ovssp\Command\SetupDemoCommand:
    tags:
      - name: console.command
        command: ovssp:setup-demo
        description: 'Create demo page tree, test data, roles, and portal plugin'
